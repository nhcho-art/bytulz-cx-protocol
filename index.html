<title>BYTULZ CX 프로토콜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;800&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* Layout: an illustrated infographic poster designed at 1280px and scaled to the window width (no sideways scroll). A = every protocol on one poster. C = hub poster that fits one screen, click a protocol to open its illustrated flow. Single light look by choice. */
:root {
  --bg: #F3F6F3;
  --surface: #FFFFFF;
  --ink: #12211D;
  --ink-line: #1E2E2A;
  --ink-2: #4B5B56;
  --ink-3: #7B8983;
  --line: #DCE2DD;
  --accent: #0B6B63;
  --accent-soft: #E0EFEC;
  --ic-soft: #DCEEEA;
  --pop: #F2A63B;
  --warn: #A5610A;
  --warn-soft: #FBF0DC;
  --r-in: #2A4B8D;
  --r-ub: #2E8B57;
  --r-kh: #C97420;
  --r-qa: #7B52AB;
  --r-aig: #5D6975;
  --r-cu: #A8435B;
  --r-pl: #0F7A8A;
  --r-pu: #8A6D1D;
  --font-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-num: "Manrope", "Noto Sans KR", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { word-break: keep-all; overflow-wrap: anywhere; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; padding-inline: 16px; padding-block: 0 32px; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
html { scrollbar-gutter: stable; }
.wrap { max-width: 2200px; margin-inline: auto; }
.top-in { max-width: max(var(--stw, 1280px), 1180px); margin-inline: auto; }
.foot { max-width: var(--stw, 1280px); margin-inline: auto; }
#vC, #vM, #vV { padding-top: 14px; }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); padding-block: 12px 10px; border-bottom: 1px solid var(--line); }
.top-in { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
.brand b { font-family: var(--font-num); font-weight: 800; letter-spacing: .06em; font-size: 18px; }
.brand span { color: var(--ink-2); font-weight: 500; }
.brand .ver { font-family: var(--font-num); font-weight: 600; font-size: 12px; padding: 2px 8px; border: 1px solid var(--line); border-radius: 99px; color: var(--ink-2); background: var(--surface); }
.seg { display: flex; gap: 4px; background: #E7ECE8; padding: 4px; border-radius: 10px; }
.seg button { border: 0; background: transparent; padding: 7px 9px; white-space: nowrap; font-size: 14px; border-radius: 7px; font-weight: 700; color: var(--ink-2); }
.seg button.dim { opacity: .35; }
.seg button[aria-selected="true"] { background: var(--ink); color: #fff; }
.search { flex: 0 1 240px; min-width: 110px; }
@media (max-width: 1100px) { .search { flex-basis: 150px; } .home { padding: 0 10px 0 8px; } .seg { gap: 0; } .top-in { gap: 10px 8px; } .brand span:not(.ver) { display: none; } }
.search input { width: 100%; height: 40px; border: 1.5px solid #8FA19A; box-shadow: 0 1px 3px rgba(18,33,29,.10); border-radius: 8px; padding: 0 14px; background: var(--surface); font: inherit; color: var(--ink); }
.search input::placeholder { color: var(--ink-3); }
/* 검색 이동 */
img, svg, a { -webkit-user-drag: none; user-drag: none; }
.search { position: relative; }
.sbar { position: absolute; right: 0; top: calc(100% + 8px); z-index: 40; width: min(430px, calc(100vw - 24px)); background: #fff; border: 1.5px solid var(--line); border-radius: 14px; box-shadow: 0 12px 32px rgba(18,33,29,.18); padding: 10px 12px; }
.sbar[hidden] { display: none; }
.sb-row { display: flex; align-items: center; gap: 8px; }
.sb-n { font: 800 18px var(--font-num); min-width: 62px; white-space: nowrap; }
.sb-l { flex: 1; min-width: 0; font-size: 13px; color: var(--ink-2); font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sb-btn { width: 34px; height: 34px; flex: none; border-radius: 9px; border: 1.5px solid var(--line); background: #fff; display: grid; place-items: center; padding: 0; }
.sb-btn:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.sb-btn:disabled { opacity: .35; cursor: default; }
.sb-btn svg { width: 16px; height: 16px; fill: none; stroke: var(--ink); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.sb-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.sb-chips:empty { display: none; }
.sb-chip { border: 1.5px solid var(--line); background: #fff; border-radius: 99px; padding: 3px 10px; font-size: 12.5px; font-weight: 700; color: var(--ink-2); }
.sb-chip b { margin-left: 6px; font-family: var(--font-num); color: var(--accent); }
.sb-chip:hover { border-color: var(--accent); }
.sb-chip[aria-current="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
.sb-chip[aria-current="true"] b { color: #fff; }
.cur { outline: 3px solid #F2A63B; outline-offset: 3px; box-shadow: 0 0 0 8px rgba(242,166,59,.22); }
.cur.dim, .m-item.cur.dim, .row.cur.dim, .tile.cur.dim { opacity: 1; }


/* icons */
.ico { display: inline-flex; width: var(--s, 48px); height: var(--s, 48px); flex: none; }
.ic { width: 100%; height: 100%; overflow: visible; }
.ic * { fill: none; stroke: var(--ink-line); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.ic .f { fill: var(--ic-soft); }
.ic .p { fill: var(--pop); }
.ic .w { fill: #fff; }
.ic .sh { fill: rgba(18, 33, 29, .09); stroke: none; }
.hero .ic * { stroke-width: 3; }

/* stage */
.stage-wrap { display: flex; justify-content: center; }
.stage { width: 1280px; position: relative; }
.role-tag { font-size: 11px; font-weight: 700; color: #fff; padding: 1px 8px; border-radius: 4px; background: var(--rc); white-space: nowrap; }
.legend { display: flex; gap: 6px; flex-wrap: wrap; }
.ptitle { display: inline-flex; align-items: center; gap: 10px; background: var(--accent-soft); border: 2px solid #B9DAD4; border-radius: 12px; padding: 8px 20px; font-size: 22px; font-weight: 900; color: var(--accent); }
.ptitle small { font-size: 13px; font-weight: 500; color: var(--ink-2); }

/* zone */
.zone { position: relative; border: 2px solid color-mix(in srgb, var(--zc) 38%, #ffffff); background: color-mix(in srgb, var(--zc) 5%, #ffffff); border-radius: 22px; padding: 30px 22px 18px; }
.ztag { position: absolute; top: -16px; left: 24px; background: var(--zc); color: #fff; font-weight: 900; padding: 4px 16px; border-radius: 99px; font-size: 14.5px; white-space: nowrap; }
.ztag small { font-weight: 500; opacity: .92; margin-left: 8px; font-size: 12.5px; }

/* A: title band, intake, rows */
.tband { display: flex; align-items: center; gap: 24px; padding: 6px 4px 30px; }
.tband .hero { width: 116px; height: 116px; flex: none; background: #fff; border: 2px solid var(--line); border-radius: 50%; display: grid; place-items: center; }
.tband .hero .ico { --s: 92px; }
.tband h1 { font-size: 34px; font-weight: 900; letter-spacing: -.02em; line-height: 1.2; }
.tband p { color: var(--ink-2); margin-top: 4px; font-size: 15px; }
.tband .legend { margin-left: auto; max-width: 420px; justify-content: flex-end; flex: none; }
.intake { display: flex; align-items: center; gap: 0; }
.ch { display: flex; align-items: center; gap: 12px; background: #fff; border: 1.5px solid var(--line); border-radius: 14px; padding: 10px 16px; width: 236px; }
.ch b { display: block; font-size: 15px; font-weight: 900; }
.ch span { font-size: 12px; color: var(--ink-2); }
.chs { display: grid; gap: 10px; }
.arrow { flex: none; width: 46px; height: 14px; }
.arrow path { stroke: var(--ink-3); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.decide { display: flex; align-items: center; gap: 14px; background: #fff; border: 2px dashed var(--accent); border-radius: 16px; padding: 16px 22px; width: 270px; }
.decide b { display: block; font-size: 17px; font-weight: 900; }
.decide span { font-size: 12.5px; color: var(--ink-2); }
.outs { display: grid; gap: 10px; flex: 1; }
.out { display: flex; align-items: center; gap: 10px; background: var(--rc); color: #fff; border-radius: 12px; padding: 10px 16px; font-weight: 700; }
.out span { font-weight: 500; opacity: .93; font-size: 12.5px; }

.zone .row + .row { margin-top: 12px; }
.row { display: flex; align-items: flex-start; background: #fff; border: 1.5px solid var(--line); border-radius: 16px; padding: 14px 16px; cursor: pointer; transition: border-color .15s, opacity .15s; }
.row:hover { border-color: var(--zc); }
.row.dim { opacity: .2; }
.rl { width: 214px; flex: none; display: flex; gap: 12px; align-items: flex-start; margin-right: 14px; border-right: 2px dashed var(--line); align-self: stretch; }
.rl .ico { --s: 52px; }
.rl h3 { font-size: 16px; font-weight: 900; line-height: 1.3; }
.kp { display: flex; align-items: baseline; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
.kp b { font-family: var(--font-num); font-weight: 800; font-size: 22px; color: var(--accent); letter-spacing: -.02em; line-height: 1.1; }
.kp span { font-size: 11.5px; color: var(--ink-2); }
.tri { margin-top: 6px; font-size: 11px; color: var(--ink-2); line-height: 1.4; }
.rs { display: flex; align-items: flex-start; flex: 1; min-width: 0; }
.st { width: 108px; flex: none; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.st .ico { --s: 46px; }
.st b { font-size: 13px; font-weight: 700; line-height: 1.3; }
.st small { font-size: 11px; color: var(--ink-2); line-height: 1.35; }
.rs .arrow { width: 20px; margin-top: 18px; }
.res { margin-left: 8px; flex: 1; max-width: 250px; min-width: 150px; background: var(--ink); color: #fff; border-radius: 12px; padding: 10px 14px; align-self: stretch; display: flex; flex-direction: column; justify-content: center; }
.res small { font-size: 10.5px; letter-spacing: .06em; color: #A9BBB5; font-weight: 700; }
.res p { font-size: 12.5px; line-height: 1.4; margin-top: 2px; }
#stageA > .zone + .zone { margin-top: 44px; }

/* SLA band */
.band { position: relative; margin-top: 50px; border-top: 2px solid #BFD5D0; padding-top: 34px; }
.band .btag { position: absolute; top: -17px; left: 50%; transform: translateX(-50%); background: var(--accent-soft); border: 2px solid #B9DAD4; color: var(--accent); font-weight: 900; padding: 4px 22px; border-radius: 10px; font-size: 16px; white-space: nowrap; }
.slas { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
.sl { background: #fff; border: 1.5px solid var(--line); border-radius: 16px; padding: 12px 12px; display: flex; gap: 10px; align-items: center; }
.sl .ico { --s: 40px; }
.sl b { font-family: var(--font-num); font-weight: 800; font-size: 28px; color: var(--accent); line-height: 1; letter-spacing: -.02em; }
.sl h4 { font-size: 14px; margin: 2px 0 0; font-weight: 900; }
.sl p { font-size: 11px; color: var(--ink-2); line-height: 1.4; margin-top: 3px; }
.chip { display: inline-block; font-size: 11px; font-weight: 700; color: var(--warn); background: var(--warn-soft); border: 1px solid #E8CFA0; border-radius: 4px; padding: 0 6px; white-space: nowrap; }

/* C: hub */
.c-canvas .band { margin-top: 0; }
.c-canvas .ptitle { position: absolute; left: 0; top: 0; }
.c-hint { position: absolute; right: 0; top: 8px; color: var(--ink-3); font-size: 13px; }
.abs { position: absolute; }
.lz { text-align: center; }
.lz .hero { width: 176px; height: 176px; margin: 6px auto 8px; background: #fff; border: 2px solid var(--line); border-radius: 50%; display: grid; place-items: center; }
.lz .hero .ico { --s: 138px; }
.lz h3 { font-size: 18px; font-weight: 900; }
.lz p { font-size: 12.5px; color: var(--ink-2); margin-bottom: 14px; }
.lz .chs { justify-items: center; }
.lz .ch { width: 268px; text-align: left; }
.tiles { display: flex; gap: 14px; }
.tile { flex: 1; min-width: 0; height: 138px; background: #fff; border: 1.5px solid var(--line); border-radius: 16px; padding: 12px 16px; display: flex; flex-direction: column; justify-content: space-between; gap: 6px; cursor: pointer; text-align: left; transition: border-color .15s, opacity .15s, transform .15s; }
.tile .tt { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.tile:hover, .tile:focus-visible { border-color: var(--zc); transform: translateY(-2px); }
.tile.dim { opacity: .2; }
.tile .ico { --s: 46px; }
.tile h3 { font-size: 15px; font-weight: 900; line-height: 1.3; }
.tile .tk { font-family: var(--font-num); font-weight: 800; font-size: 26px; color: var(--accent); letter-spacing: -.02em; line-height: 1.1; text-align: right; }
.tile .dots { display: flex; gap: 4px; flex-wrap: wrap; }
.tile .dots .role-tag { font-size: 10px; padding: 0 6px; }
.tile .sl-note { font-size: 11px; font-weight: 700; color: var(--warn); }
.lbl { position: absolute; transform: translate(-50%, -50%); background: var(--rc); color: #fff; font-size: 12.5px; font-weight: 700; padding: 3px 12px; border-radius: 99px; white-space: nowrap; }

/* C: detail */
.d-top { display: flex; align-items: center; gap: 20px; padding-block: 4px 22px; }
.back { border: 1.5px solid var(--line); background: #fff; border-radius: 10px; padding: 8px 16px; font-weight: 700; }
.back:hover { border-color: var(--ink-2); }
.d-ico { width: 92px; height: 92px; border-radius: 50%; background: #fff; border: 2px solid var(--line); display: grid; place-items: center; flex: none; }
.d-ico .ico { --s: 62px; }
.d-top h1 { font-size: 30px; font-weight: 900; letter-spacing: -.02em; line-height: 1.25; }
.d-top p { color: var(--ink-2); margin-top: 2px; }
.d-key { margin-left: auto; text-align: right; }
.d-key b { display: block; font-family: var(--font-num); font-weight: 800; font-size: 54px; color: var(--accent); line-height: 1; letter-spacing: -.02em; }
.d-key span { font-size: 13px; color: var(--ink-2); }
.tri-row { display: flex; align-items: stretch; gap: 14px; margin-bottom: 24px; }
.tri-h { display: flex; align-items: center; font-weight: 900; padding-right: 8px; color: var(--ink-2); }
.tri-c { flex: 1; display: flex; gap: 12px; align-items: center; background: #fff; border: 2px dashed var(--r-ub); border-radius: 14px; padding: 12px 16px; font-size: 13.5px; }
.tri-c b { display: block; font-size: 15px; }
.flow { display: grid; gap: 0 28px; margin-bottom: 22px; }
.sc { position: relative; background: #fff; border: 2px solid var(--rc); border-radius: 16px; overflow: visible; display: flex; flex-direction: column; }
.sc:not(:last-child)::after { content: ""; position: absolute; top: 74px; right: -27px; width: 26px; height: 2px; background: repeating-linear-gradient(90deg, var(--ink-3) 0 4px, transparent 4px 8px); }
.sc:not(:last-child)::before { content: ""; position: absolute; top: 69px; right: -29px; border-left: 8px solid var(--ink-3); border-top: 6px solid transparent; border-bottom: 6px solid transparent; z-index: 1; }
.sc-r { background: var(--rc); color: #fff; font-size: 13px; font-weight: 700; padding: 5px 14px; border-radius: 12px 12px 0 0; display: flex; justify-content: space-between; }
.sc-b { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 8px; }
.sc-b .ico { --s: 54px; }
.sc-b h3 { font-size: 15.5px; font-weight: 900; line-height: 1.3; }
.sc-b p { font-size: 13px; color: var(--ink-2); line-height: 1.5; }
.concl { display: flex; align-items: center; gap: 18px; background: var(--ink); color: #fff; border-radius: 18px; padding: 18px 26px; margin-bottom: 18px; }
.concl .ico { --s: 60px; }
.concl small { font-size: 12px; letter-spacing: .08em; color: #A9BBB5; font-weight: 700; }
.concl p { font-size: 17px; font-weight: 500; line-height: 1.5; }
.extras { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
.xbox { background: #fff; border: 1.5px solid var(--line); border-radius: 14px; padding: 16px 20px; }
.xbox h4 { margin: 0 0 8px; font-size: 12px; letter-spacing: .06em; color: var(--ink-3); font-weight: 700; }
.xbox.pend { background: var(--warn-soft); border-color: #E8CFA0; }
.xbox.pend h4 { color: var(--warn); }
.list { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: 14px; }

/* contact view */
.page { max-width: 1240px; margin-inline: auto; }
.head { padding-block: 20px 14px; }
.head h1 { font-size: 30px; font-weight: 900; }
.head p { color: var(--ink-2); margin-top: 4px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 14px; }
.box { background: #fff; border: 1.5px solid var(--line); border-radius: 14px; padding: 20px; min-width: 0; }
.box h3 { margin: 0 0 12px; font-size: 17px; font-weight: 900; }
.kv { display: grid; grid-template-columns: 100px minmax(0, 1fr); gap: 4px 12px; padding-block: 9px; border-top: 1px solid var(--line); }
.kv:first-of-type { border-top: 0; }
.kv dt { color: var(--ink-3); font-size: 13px; }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.tel { font-family: var(--font-num); font-weight: 800; font-size: 20px; }
.say { background: var(--bg); border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; }
.say small { display: block; color: var(--ink-3); font-weight: 700; letter-spacing: .05em; font-size: 11.5px; margin-bottom: 4px; }
.say p { margin: 0 0 8px; white-space: pre-line; }
.copy { border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 4px 12px; font-size: 12.5px; font-weight: 700; }
.foot { margin-top: 28px; padding-top: 14px; border-top: 1px solid var(--line); color: var(--ink-3); font-size: 12.5px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
@media (prefers-reduced-motion: reduce) { .tile, .row { transition: none; } }
/* ---------- manual ---------- */
.m-cats { display: grid; grid-template-columns: repeat(7, 1fr); gap: 12px; margin-top: 4px; }
.m-cat { text-align: left; background: #fff; border: 2px solid var(--line); border-radius: 16px; padding: 14px 14px 12px; display: flex; flex-direction: column; gap: 8px; position: relative; transition: border-color .15s; }
.m-cat:hover { border-color: #9CC6BF; }
.m-cat[aria-selected="true"] { border-color: var(--accent); background: var(--accent-soft); }
.m-cat .n { position: absolute; top: 10px; right: 14px; font: 800 13px var(--font-num); color: var(--ink-3); }
.m-cat b { font-size: 17px; font-weight: 900; line-height: 1.25; }
.m-cat small { color: var(--ink-2); font-size: 12.5px; line-height: 1.35; }
.m-cat.dim, .m-item.dim { opacity: .25; }
.m-panel { margin-top: 20px; background: #fff; border: 2px solid var(--line); border-radius: 22px; padding: 26px 26px 24px; }
.m-title { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
.m-title h2 { font-size: 24px; font-weight: 900; }
.m-title p { color: var(--ink-2); font-size: 14px; }
.m-title .lg { margin-left: auto; display: flex; gap: 8px; }
.m-badge { display: inline-flex; align-items: center; font-size: 12px; font-weight: 800; color: #fff; padding: 2px 10px; border-radius: 99px; white-space: nowrap; background: var(--bc, var(--ink-2)); }
.k-ok { --bc: var(--r-ub); } .k-fix { --bc: var(--r-kh); } .k-as { --bc: var(--r-cu); } .k-nv { --bc: var(--r-in); } .k-gr { --bc: var(--r-aig); }
.m-flow { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 34px; margin-bottom: 20px; }
.m-fs { position: relative; background: var(--bg); border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 14px; display: flex; gap: 10px; align-items: center; min-height: 78px; }
.m-fs + .m-fs::before { content: ""; position: absolute; left: -26px; top: 50%; width: 18px; border-top: 2.5px dashed #8FA39D; }
.m-fs + .m-fs::after { content: ""; position: absolute; left: -12px; top: calc(50% - 6px); border: 6px solid transparent; border-left: 8px solid #8FA39D; border-right: 0; }
.m-fs h4 { font-size: 14.5px; font-weight: 900; margin: 0; line-height: 1.3; }
.m-fs p { font-size: 12.5px; color: var(--ink-2); line-height: 1.35; margin: 2px 0 0; }
.m-fs.end { background: var(--warn-soft); border-color: #E9CD9B; }
.m-two { display: grid; grid-template-columns: 372px minmax(0, 1fr); gap: 22px; align-items: start; }
.m-illus { background: linear-gradient(#F2F7F5, #E6F0ED); border: 1.5px solid #CFE2DD; border-radius: 18px; padding: 14px 14px 12px; text-align: center; }
.m-illus svg { width: 100%; height: auto; display: block; }
.m-illus p { font-size: 12px; color: var(--ink-3); margin-top: 6px; }
.m-illus h3 { font-size: 15px; font-weight: 900; text-align: left; margin-bottom: 4px; }
